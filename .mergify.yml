merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

# The PR, its required checks and this queue are the review (smarty-dev
# docs/factory.md). The Astra reviewer queues a ready PR after its success
# verdict. `hold` and do-not-land/merge or never-land titles keep a PR out.
queue_rules:
  - name: default
    batch_size: 4
    batch_max_wait_time: 2 min
    checks_timeout: 130 min
    merge_method: merge
    queue_conditions:
      - base ~= ^(?:main|codex/maintenance-0\.153\.4)$
      - -draft
      - -label = hold
      - -title ~= (?i)(do not (land|merge)|never land)
      - check-success = review/astra
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
      - -check-failure = smarty-ci

# GitHub suspended smarty-agents (2026-09-25); the review agent queues as the write App's bot,
# which has no collaborator permission (smarty-dev#735). Humans with write access still can.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]

# Sanctioned front-of-queue route, as smarty-dev (#2004 T10; org for Paul 2026-10-02): a PR labelled p0 is
# checked ahead of the rest of the queue.
priority_rules:
  - name: p0
    conditions:
      - label = p0
    priority: high
    # Priority must not discard in-flight CI (smarty-dev decision #2143, proven #2356).
    allow_checks_interruption: false
