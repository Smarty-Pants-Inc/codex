name: setup-rusty-v8
description: Download and verify Codex-built rusty_v8 artifacts for Cargo builds.
inputs:
  target:
    description: Rust target triple with Codex-built V8 release artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Configure rusty_v8 artifact overrides and verify checksums
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail

        version="$(python3 "${GITHUB_WORKSPACE}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
        release_tag="rusty-v8-v${version}"
        api_url="https://api.github.com/repos/openai/codex"
        binding_dir="${RUNNER_TEMP}/rusty_v8"
        
        profile="ptrcomp_sandbox_release"

        if [[ "$TARGET" == *-pc-windows-msvc ]]; then
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
        else
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
        fi
        binding_name="src_binding_${profile}_${TARGET}.rs"
        checksums_name="rusty_v8_${profile}_${TARGET}.sha256"

        archive_path="${binding_dir}/${archive_name}"
        binding_path="${binding_dir}/${binding_name}"
        checksums_path="${binding_dir}/${checksums_name}"

        mkdir -p "${binding_dir}"
        release_path="${binding_dir}/release.json"
        printf 'Resolving V8 release %s\n' "${release_tag}"
        curl -fsSL --retry 1 --retry-max-time 30 --connect-timeout 10 --max-time 60 \
          -H 'Accept: application/vnd.github+json' --max-filesize 2097152 \
          "${api_url}/releases/tags/${release_tag}" -o "${release_path}"
        for artifact_name in "${archive_name}" "${binding_name}" "${checksums_name}"; do
          asset_id="$(python3 - "${release_path}" "${release_tag}" "${artifact_name}" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as stream:
            release = json.load(stream)
        if release.get("tag_name") != sys.argv[2]:
            sys.exit("Unexpected V8 release tag")
        assets = [asset for asset in release["assets"] if asset.get("name") == sys.argv[3]]
        if len(assets) != 1 or type(assets[0].get("id")) is not int or assets[0]["id"] <= 0:
            sys.exit(f"Expected one V8 release asset: {sys.argv[3]}")
        print(assets[0]["id"])
        PY
          )"
          printf 'Downloading %s (asset %s)\n' "${artifact_name}" "${asset_id}"
          curl -fsSL --retry 1 --retry-max-time 30 --connect-timeout 10 --max-time 60 \
            -H 'Accept: application/octet-stream' \
            "${api_url}/releases/assets/${asset_id}" -o "${binding_dir}/${artifact_name}"
        done

        if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
          echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
          exit 1
        fi

        # Existing Windows-built release manifests use CRLF line endings.
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
        else
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | shasum -a 256 -c -)
        fi
        echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
        echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"
