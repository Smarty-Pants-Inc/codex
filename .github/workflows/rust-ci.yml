name: rust-ci
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # --- Detect what changed so the fast PR workflow only runs relevant jobs ----
  changed:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') }}
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On manual runs, default to the full fast-PR bundle.
            files=("codex-rs/force" "tools/argument-comment-lint/force" ".github/force")
          fi

          codex=false
          argument_comment_lint=false
          argument_comment_lint_package=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == codex-rs/* || $f == tools/argument-comment-lint/* || $f == justfile ]] && argument_comment_lint=true
            [[ $f == defs.bzl || $f == workspace_root_test_launcher.sh.tpl || $f == workspace_root_test_launcher.bat.tpl ]] && argument_comment_lint=true
            [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml ]] && argument_comment_lint_package=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "argument_comment_lint=$argument_comment_lint" >> "$GITHUB_OUTPUT"
          echo "argument_comment_lint_package=$argument_comment_lint_package" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # --- Fast Cargo-native PR checks -------------------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') && (needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true') }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') && (needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true') }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') && needs.changed.outputs.argument_comment_lint_package == 'true' }}
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-09-18 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2025-09-18
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_prebuilt:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') }}
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: changed
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            timeout_minutes: 30
          - name: macOS
            runner: macos-15-xlarge
            timeout_minutes: 30
          - name: Windows
            runner: windows-x64
            timeout_minutes: 30
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64
    steps:
      - name: Check whether argument comment lint should run
        id: argument_comment_lint_gate
        shell: bash
        env:
          ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          WORKFLOWS: ${{ needs.changed.outputs.workflows }}
        run: |
          if [[ "$ARGUMENT_COMMENT_LINT" == "true" || "$WORKFLOWS" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No argument-comment-lint relevant changes."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        with:
          persist-credentials: false
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.argument_comment_lint_gate.outputs.run == 'true'
        uses: ./.github/actions/check-clean-worktree

  # --- Gatherer job that you mark as the ONLY required status -----------------
  results:
    name: CI results (required)
    needs:
      [
        changed,
        general,
        cargo_shear,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
      ]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "arglint: ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"

          # If nothing relevant changed (PR touching only root README, etc.),
          # declare success regardless of other jobs.
          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_CODEX}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" != 'true' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
            [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          fi
        env:
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
          NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package }}

  native_foundation:
    permissions:
      contents: read
    if: ${{ github.repository == 'Smarty-Pants-Inc/codex' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-startup-fa2f2a-1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: codex-startup-fa2f2a-1
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_NET_RETRY: '0'
      CARGO_HTTP_TIMEOUT: '60'
      CARGO_INCREMENTAL: '0'
      INSTA_UPDATE: 'no'
      USE_SCCACHE: 'true'
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_GHA_VERSION: smarty-startup-fa47688c65e86c48cc465d7e0d6195dc6338917f60a04893cf518eb171f7e2b4
      TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Start original disposable clock before checkout
        timeout-minutes: 1
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,sys,time
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'codex-startup-clock.json'
          with p.open('x') as f:
              json.dump({'start':time.monotonic(),'wall':time.time(),'python_path':sys.executable,'python_sha256':hashlib.sha256(pathlib.Path(sys.executable).read_bytes()).hexdigest()},f)
          PY
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/codex-startup-target" >> "$GITHUB_ENV"
      - name: Checkout exact focused definition
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Bind sole-parent H and exact definition before provisioning
        timeout-minutes: 1
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py initialize
      - name: Admit bounded Rust install step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 4
      - name: Provision Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        timeout-minutes: 4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy, rust-src
      - name: Admit bounded auxiliary tool install step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 3
      - name: Provision just nextest and sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        timeout-minutes: 3
        with:
          tool: just@1.51.0,nextest@0.9.103,sccache@0.7.5
      - name: Admit bounded DotSlash install step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 1
      - name: Provision DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
        timeout-minutes: 1
      - name: Admit bounded uv install step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 1
      - name: Provision uv 0.11.3
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        timeout-minutes: 1
        with:
          version: 0.11.3
          enable-cache: false
      - name: Admit bounded disposable package setup step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 2
      - name: Disposable Linux prerequisites only
        timeout-minutes: 2
        run: |
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Original sccache backend selection
        timeout-minutes: 1
        run: |
          /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 1
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
          else
            echo 'SCCACHE_GHA_ENABLED=false' >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=$RUNNER_TEMP/codex-native-foundation-sccache" >> "$GITHUB_ENV"
          fi
      - name: Admit bounded cache restore step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 1
      - name: Restore same-lock compiler cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cache_restore
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/codex-native-foundation-sccache/
          key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-native_foundation-fa47688c65e86c48cc465d7e0d6195dc6338917f60a04893cf518eb171f7e2b4-${{ github.run_id }}
          restore-keys: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-native_foundation-fa47688c65e86c48cc465d7e0d6195dc6338917f60a04893cf518eb171f7e2b4-
      - name: Admit bounded V8 provision step
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py guard 2
      - name: Configure exact V8 artifact pair
        timeout-minutes: 2
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Observe tools verify V8 fetch locked dependencies once
        timeout-minutes: 20
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py provision
      - name: One locked offline integration compile/discovery phase
        timeout-minutes: 90
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py run
      - name: Retain source index drift and UNRUN facts
        if: always()
        timeout-minutes: 3
        run: /usr/bin/python3 -I -S -B .github/scripts/startup_focused.py finish
      - name: Retain action outcomes and cache miss facts
        if: always()
        timeout-minutes: 1
        env:
          CACHE_OUTCOME: ${{ steps.cache_restore.outcome }}
          CACHE_PRIMARY_KEY: ${{ steps.cache_restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache_restore.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache_restore.outputs.cache-hit }}
          ACTION_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('backend-evidence');p.mkdir(exist_ok=True)
          (p/'cache-restore.json').write_text(json.dumps({k:os.environ.get(k) for k in ('CACHE_OUTCOME','CACHE_PRIMARY_KEY','CACHE_MATCHED_KEY','CACHE_EXACT_HIT','SCCACHE_GHA_ENABLED')})+'\n')
          (p/'action-outcomes.json').write_text(os.environ['ACTION_OUTCOMES']+'\n')
          PY
      - name: Retain focused evidence without cache promotion
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-startup-focused-${{ github.sha }}-${{ github.run_attempt }}
          path: backend-evidence/
          retention-days: 1
          if-no-files-found: error
