name: rust-ci
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # --- Detect what changed so the fast PR workflow only runs relevant jobs ----
  changed:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') }}
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On manual runs, default to the full fast-PR bundle.
            files=("codex-rs/force" "tools/argument-comment-lint/force" ".github/force")
          fi

          codex=false
          argument_comment_lint=false
          argument_comment_lint_package=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == codex-rs/* || $f == tools/argument-comment-lint/* || $f == justfile ]] && argument_comment_lint=true
            [[ $f == defs.bzl || $f == workspace_root_test_launcher.sh.tpl || $f == workspace_root_test_launcher.bat.tpl ]] && argument_comment_lint=true
            [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml ]] && argument_comment_lint_package=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "argument_comment_lint=$argument_comment_lint" >> "$GITHUB_OUTPUT"
          echo "argument_comment_lint_package=$argument_comment_lint_package" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # --- Fast Cargo-native PR checks -------------------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') && (needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true') }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') && (needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true') }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') && (needs.changed.outputs.argument_comment_lint_package == 'true') }}
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-09-18 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2025-09-18
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  argument_comment_lint_prebuilt:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') }}
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: changed
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            timeout_minutes: 30
          - name: macOS
            runner: macos-15-xlarge
            timeout_minutes: 30
          - name: Windows
            runner: windows-x64
            timeout_minutes: 30
            runs_on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64
    steps:
      - name: Check whether argument comment lint should run
        id: argument_comment_lint_gate
        shell: bash
        env:
          ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          WORKFLOWS: ${{ needs.changed.outputs.workflows }}
        run: |
          if [[ "$ARGUMENT_COMMENT_LINT" == "true" || "$WORKFLOWS" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No argument-comment-lint relevant changes."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        with:
          persist-credentials: false
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ steps.argument_comment_lint_gate.outputs.run == 'true' }}
        uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Check for a clean worktree
        if: always() && !cancelled() && steps.argument_comment_lint_gate.outputs.run == 'true'
        uses: ./.github/actions/check-clean-worktree

  # --- Gatherer job that you mark as the ONLY required status -----------------
  results:
    name: CI results (required)
    needs:
      [
        changed,
        general,
        cargo_shear,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
      ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1') && (always()) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "arglint: ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"

          # If nothing relevant changed (PR touching only root README, etc.),
          # declare success regardless of other jobs.
          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_CODEX}" != 'true' && "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" != 'true' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt failed'; exit 1; }
          fi

          if [[ "${NEEDS_CHANGED_OUTPUTS_CODEX}" == 'true' || "${NEEDS_CHANGED_OUTPUTS_WORKFLOWS}" == 'true' ]]; then
            [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
            [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
          fi
        env:
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT: ${{ needs.changed.outputs.argument_comment_lint }}
          NEEDS_CHANGED_OUTPUTS_CODEX: ${{ needs.changed.outputs.codex }}
          NEEDS_CHANGED_OUTPUTS_WORKFLOWS: ${{ needs.changed.outputs.workflows }}
          NEEDS_CHANGED_OUTPUTS_ARGUMENT_COMMENT_LINT_PACKAGE: ${{ needs.changed.outputs.argument_comment_lint_package }}

  native_foundation:
    if: ${{ github.repository == 'Smarty-Pants-Inc/codex' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/codex-fullgate-41ceb12b-1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      INSTA_UPDATE: 'no'
      USE_SCCACHE: 'true'
      CARGO_INCREMENTAL: '0'
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IDLE_TIMEOUT: '0'
      CI_TIME_FORMAT: '{"elapsed_seconds":%e,"user_seconds":%U,"system_seconds":%S,"max_rss_kib":%M}'
      TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
    - name: Set disposable backend build directory
      run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/codex-native-foundation-target" >> "$GITHUB_ENV"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - name: Bind exact C and single-parent definition D before setup
      run: python3 .github/scripts/native_foundation.py initialize
    - name: Record backend initial resources
      run: |
        mkdir -p backend-evidence
        {
          date -u +%FT%TZ
          nproc
          free -b
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
        } > backend-evidence/resources-start.txt 2>&1
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      with:
        components: rustfmt, clippy, rust-src
    - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
      with:
        tool: just@1.51.0,nextest@0.9.103
    - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: 0.11.3
        enable-cache: false
    - name: Native Linux backend prerequisites (disposable runner only)
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Record backend source and toolchain
      run: |-
        set -euo pipefail
        { rustc -Vv; cargo -V; just --version; cargo nextest --version; uv --version; /usr/bin/time --version; uname -a; } > backend-evidence/tools.txt
        test "$(rustc -V | cut -d' ' -f2)" = 1.95.0
        test "$(just --version)" = 'just 1.51.0'
        nextest_version="$(cargo nextest --version)"
        test "$(printf '%s\n' "$nextest_version" | sed -n 's/^release: //p')" = 0.9.103
        test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
        sha256sum codex-rs/Cargo.lock codex-rs/rust-toolchain.toml codex-rs/.config/nextest.toml \
          justfile scripts/just-shell.py scripts/format.py scripts/uv.lock sdk/python/uv.lock tools/buildifier \
          .github/workflows/rust-ci.yml .github/scripts/native_foundation.py \
          .github/scripts/native_foundation_recipe.json .github/actions/setup-rusty-v8/action.yml \
          > backend-evidence/inputs.sha256
    - name: Install sccache
      if: ${{ env.USE_SCCACHE == 'true' }}
      uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
      with:
        tool: sccache@0.7.5
    - name: Verify sccache version
      if: ${{ env.USE_SCCACHE == 'true' }}
      run: |
        version="$(sccache --version)"
        printf '%s\n' "$version" | tee backend-evidence/sccache-version.txt
        test "$version" = 'sccache 0.7.5'
    - name: Configure sccache backend
      if: ${{ env.USE_SCCACHE == 'true' }}
      run: |
        set -euo pipefail
        if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "Using sccache GitHub backend"
        else
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/codex-native-foundation-sccache" >> "$GITHUB_ENV"
          echo "Using sccache local disk + actions/cache fallback"
        fi
    - name: Enable sccache wrapper
      if: ${{ env.USE_SCCACHE == 'true' }}
      run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: Restore sccache cache (fallback)
      if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
      id: cache_sccache_restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ runner.temp }}/codex-native-foundation-sccache/
        key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
        restore-keys: |
          sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
    - name: Record compiler cache restore
      if: always()
      env:
        CACHE_OUTCOME: ${{ steps.cache_sccache_restore.outcome }}
        CACHE_PRIMARY_KEY: ${{ steps.cache_sccache_restore.outputs.cache-primary-key }}
        CACHE_MATCHED_KEY: ${{ steps.cache_sccache_restore.outputs.cache-matched-key }}
        CACHE_EXACT_HIT: ${{ steps.cache_sccache_restore.outputs.cache-hit }}
      run: |
        mkdir -p backend-evidence
        jq -n '{event:env.GITHUB_EVENT_NAME,ref:env.GITHUB_REF,
          gha_backend:env.SCCACHE_GHA_ENABLED,outcome:env.CACHE_OUTCOME,
          primary_key:env.CACHE_PRIMARY_KEY,matched_key:env.CACHE_MATCHED_KEY,
          exact_hit:env.CACHE_EXACT_HIT}' > backend-evidence/cache-restore.json
    - name: Configure matching sandbox V8 artifacts
      uses: ./.github/actions/setup-rusty-v8
      with:
        target: x86_64-unknown-linux-gnu
    - name: Build backend runtime test prerequisites
      working-directory: codex-rs
      run: |
        set -euo pipefail
        sha256sum "$RUSTY_V8_ARCHIVE" "$RUSTY_V8_SRC_BINDING_PATH" \
          > ../backend-evidence/rusty-v8.sha256
        # Package-scoped nextest runs do not build sibling packages' executables.
        cargo build --locked \
          -p codex-cli --bin codex \
          -p codex-rmcp-client --bin test_stdio_server --bin test_streamable_http_server \
          -p codex-code-mode-host --bin codex-code-mode-host \
          -p codex-linux-sandbox --bin codex-linux-sandbox \
          -p codex-shell-escalation --bin codex-execve-wrapper \
          2>&1 | tee ../backend-evidence/runtime-prerequisites.txt
        for binary in codex test_stdio_server test_streamable_http_server codex-code-mode-host codex-linux-sandbox codex-execve-wrapper; do
          path="$CARGO_TARGET_DIR/debug/$binary"
          if [[ ! -x "$path" ]]; then
            echo "Missing runtime test executable: $path" >&2
            exit 1
          fi
          sha256sum "$path" >> ../backend-evidence/runtime-prerequisites.sha256
          echo "CARGO_BIN_EXE_$binary=$path" >> "$GITHUB_ENV"
          if [[ "$binary" == *-* ]]; then
            echo "CARGO_BIN_EXE_${binary//-/_}=$path" >> "$GITHUB_ENV"
          fi
        done
    - name: Foundation and full TUI discovery and tests then scoped fixes fmt fmt-check
      run: python3 .github/scripts/native_foundation.py run
    - name: Always retain complete source inventory index and writeback bytes
      if: always()
      run: python3 .github/scripts/native_foundation.py finish
    - name: Save sccache cache (fallback)
      id: cache_sccache_save
      if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ runner.temp }}/codex-native-foundation-sccache/
        key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
    - name: sccache stats
      if: always() && env.USE_SCCACHE == 'true'
      continue-on-error: true
      env:
        CACHE_SAVE_OUTCOME: ${{ steps.cache_sccache_save.outcome }}
      run: |
        mkdir -p backend-evidence
        jq -n '{outcome:env.CACHE_SAVE_OUTCOME}' > backend-evidence/cache-save.json
        sccache --show-stats 2>&1 | tee backend-evidence/sccache.txt || true
    - name: sccache summary
      if: always() && env.USE_SCCACHE == 'true'
      run: "{\n  echo \"### sccache stats \u2014 x86_64-unknown-linux-gnu (native-foundation)\";\n  echo;\n  echo '```';\n  sccache --show-stats || true;\n  echo '```';\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Record backend final resources
      if: always()
      run: |
        mkdir -p backend-evidence
        failed=0
        {
          date -u +%FT%TZ || failed=1
          free -b || failed=1
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || failed=1
          if [[ ! -f backend-evidence/resources-start.txt ]]; then
            echo 'Initial resource receipt absent; initial phase did not complete.'
          fi
          for path in "${CARGO_TARGET_DIR:-}" "$GITHUB_WORKSPACE/backend-evidence"; do
            if [[ -e "$path" ]]; then
              du -sxB1 "$path" || failed=1
            else
              printf 'Path absent (not measured): %s\n' "$path"
            fi
          done
        } > backend-evidence/resources-final.txt 2>&1
        exit "$failed"
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      if: always()
      with:
        name: codex-native-foundation-${{ github.sha }}-${{ github.run_attempt }}
        path: backend-evidence/
        retention-days: 1
        if-no-files-found: error
    name: Scoped native foundation (5406)
    permissions:
      contents: read
    concurrency:
      group: codex-fullgate-41ceb12b-1
      cancel-in-progress: false
