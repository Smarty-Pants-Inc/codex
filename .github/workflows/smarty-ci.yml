name: smarty-ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-d75-causal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  causal:
    name: d75-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [core, app]
    env:
      D75_LANE: ${{ matrix.lane }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '0'
      NEXTEST_PROFILE: local
      RUST_MIN_STACK: '8388608'
      INSTA_UPDATE: 'no'
    steps:
      - name: Guard one-shot candidate event
        env:
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Smarty-Pants-Inc/codex
          test "$EVENT_REPOSITORY_ID" = 1047329867
          test "$GITHUB_REF" = refs/heads/qualify/codex-d75-causal
          test "$GITHUB_WORKFLOW_REF" = Smarty-Pants-Inc/codex/.github/workflows/smarty-ci.yml@refs/heads/qualify/codex-d75-causal
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EVENT_WORKFLOW_SHA" = "$GITHUB_SHA"
          test ! -e /tmp/codex-d75-causal
          test ! -L /tmp/codex-d75-causal
          mkdir -m 700 -p "/tmp/codex-d75-causal/$D75_LANE"
      - name: Checkout exact wrapper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout reviewed product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d75f0d72f3d3f9870db0d1a6e98128bc730ae5ac
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Bind source and wrapper
        id: bind
        run: |
          set -euo pipefail
          test "$(git -C wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C wrapper rev-parse HEAD^)" = d75f0d72f3d3f9870db0d1a6e98128bc730ae5ac
          test "$(git -C product rev-parse HEAD)" = d75f0d72f3d3f9870db0d1a6e98128bc730ae5ac
          test "$(git -C product rev-parse HEAD^{tree})" = 9d3ad5e06fbe64ed9c7bb721eafe980e8d095c09
          for checkout in wrapper product; do
            git -C "$checkout" diff --exit-code
            git -C "$checkout" diff --cached --exit-code
            test -z "$(git -C "$checkout" ls-files --others --exclude-standard)"
          done
          (cd wrapper/.github/qualification/d75-causal && sha256sum -c RECIPE.sha256)
          base="/tmp/codex-d75-causal/$D75_LANE"
          mv product "$base/source"
          mkdir -m 700 "$base/evidence"
          export D75_EVIDENCE_DIR="$base/evidence"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          e=os.environ
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          source=Path('/tmp/codex-d75-causal')/e['D75_LANE']/'source'
          h,t,p=git('-C',str(source),'show','-s','--format=%H %T %P').split()
          row={'product':h,'tree':t,'parent':p,'wrapper':e['GITHUB_SHA'],
               'wrapper_tree':git('-C','wrapper','rev-parse','HEAD^{tree}'),
               'workflow_sha256':hashlib.sha256(Path('wrapper/.github/workflows/smarty-ci.yml').read_bytes()).hexdigest(),
               'repository':e['GITHUB_REPOSITORY'],'repository_id':'1047329867',
               'run':e['GITHUB_RUN_ID'],'attempt':e['GITHUB_RUN_ATTEMPT'],'job_key':e['GITHUB_JOB'],
               'workflow_ref':e['GITHUB_WORKFLOW_REF'],'ref':e['GITHUB_REF'],'lane':e['D75_LANE'],
               'runner_name':e['RUNNER_NAME'],'runner_os':e['RUNNER_OS'],'runner_arch':e['RUNNER_ARCH'],
               'recipe_manifest_sha256':hashlib.sha256(Path('wrapper/.github/qualification/d75-causal/RECIPE.sha256').read_bytes()).hexdigest()}
          Path(e['D75_EVIDENCE_DIR'],'custody.json').write_text(json.dumps(row,indent=2)+'\n')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy,rust-src
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Existing Linux build dependencies (no sandbox-policy changes)
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libssl-dev protobuf-compiler
          sudo cp "$(command -v dotslash)" /usr/local/bin/dotslash
      - name: Serial causal lane within one shared 30-minute timeout
        id: lane
        run: |
          set -euo pipefail
          base="/tmp/codex-d75-causal/$D75_LANE"
          export D75_RECIPE="$GITHUB_WORKSPACE/wrapper/.github/qualification/d75-causal"
          export D75_EVIDENCE_DIR="$base/evidence"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="$base/cargo-home"
          export HOME="$base/home" TMPDIR="$base/tmp" CODEX_HOME="$base/codex-home" CARGO_TARGET_DIR="$base/target"
          mkdir -m 700 "$HOME" "$TMPDIR" "$CODEX_HOME" "$CARGO_HOME"
          if test "$D75_LANE" = core; then export CODEX_OBSERVATION_CAPACITY_FIXTURES="$base/fixtures"; fi
          cd "$base/source"
          set +e
          timeout --signal=TERM --kill-after=5s 1800s bash "$D75_RECIPE/run-lane.sh" > "$D75_EVIDENCE_DIR/wrapper.stdout" 2> "$D75_EVIDENCE_DIR/wrapper.stderr"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$D75_EVIDENCE_DIR/external-lane-exit.txt"
          exit "$rc"
      - name: Produce and separately stage bounded DATA, including first failure
        id: evidence
        if: always() && steps.bind.outputs.ready == 'true'
        run: |
          set -euo pipefail
          base="/tmp/codex-d75-causal/$D75_LANE"
          recipe="$GITHUB_WORKSPACE/wrapper/.github/qualification/d75-causal"
          if ! test -f "$base/evidence/external-lane-exit.txt"; then printf '125\n' > "$base/evidence/external-lane-exit.txt"; fi
          python3 "$recipe/produce-evidence.py" "$base/evidence" "$D75_LANE"
          python3 "$recipe/stage-upload.py" "$base/evidence" "$base/validated-upload"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload only validated bounded lane evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: d75-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/codex-d75-causal/${{ matrix.lane }}/validated-upload/
          if-no-files-found: error
          retention-days: 7
