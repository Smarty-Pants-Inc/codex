name: smarty-ci

# Maintenance baseline plus complete backend project checks. Publication is gated
# by source/workflow/cost admission; this definition does not authorize dispatch.
on:
  pull_request:
    branches: [codex/maintenance-0.153.4]
  push:
    branches: [codex/maintenance-0.153.4, ci/sense19-generators]

permissions:
  contents: read

concurrency:
  group: codex-maintenance-0.153.4
  cancel-in-progress: false

jobs:
  maintenance-baseline:
    if: github.repository == 'Smarty-Pants-Inc/codex' && github.ref != 'refs/heads/ci/sense19-generators'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      INSTA_UPDATE: 'no'
      TARGET: x86_64-unknown-linux-gnu
      USE_SCCACHE: 'true'
      CARGO_INCREMENTAL: '0'
      SCCACHE_CACHE_SIZE: 10G
      # Long tests/link steps must not expire the job-local server and reset its counters.
      SCCACHE_IDLE_TIMEOUT: '0'
      FILTER: 'test(realtime_) | test(history_replay) | test(replay_thread_snapshot) | test(rollout_history) | test(session_lifecycle_requests) | test(thread_event) | test(reconnect) | test(tokens) | test(exec_flow)'
    defaults:
      run:
        shell: bash
    steps:
      - name: Set disposable build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/codex-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR: GitHub's combined merge revision. Push: the exact landed commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Native Linux test prerequisites (disposable runner only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Record exact source and toolchain
        run: |
          set -euo pipefail
          mkdir -p evidence package
          jq -n --arg commit "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg definition "${GITHUB_WORKFLOW_SHA}" --arg run "${GITHUB_RUN_ID}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" --arg job "${GITHUB_JOB}" \
            --arg target "$TARGET" --arg filter "$FILTER" \
            '{commit:$commit,tree:$tree,definition:$definition,run:$run,attempt:$attempt,job:$job,target:$target,filter:$filter,retries:0}' > evidence/source.json
          { rustc -Vv; cargo -V; just --version; cargo nextest --version; uname -a; } > evidence/tools.txt
          sha256sum codex-rs/Cargo.lock codex-rs/rust-toolchain.toml .github/workflows/smarty-ci.yml > evidence/inputs.sha256
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.7.5
      - name: Verify sccache version
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: |
          version="$(sccache --version)"
          printf '%s\n' "$version" | tee evidence/sccache-version.txt
          test "$version" = 'sccache 0.7.5'
      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi
      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Record compiler cache restore
        if: always()
        env:
          CACHE_OUTCOME: ${{ steps.cache_sccache_restore.outcome }}
          CACHE_PRIMARY_KEY: ${{ steps.cache_sccache_restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache_sccache_restore.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache_sccache_restore.outputs.cache-hit }}
        run: |
          mkdir -p evidence
          jq -n '{event:env.GITHUB_EVENT_NAME,ref:env.GITHUB_REF,
            gha_backend:env.SCCACHE_GHA_ENABLED,outcome:env.CACHE_OUTCOME,
            primary_key:env.CACHE_PRIMARY_KEY,matched_key:env.CACHE_MATCHED_KEY,
            exact_hit:env.CACHE_EXACT_HIT}' > evidence/cache-restore.json
      - name: Format check
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Discover exact focused test roster
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo nextest list --locked -p codex-tui --message-format json > ../evidence/discovered.json
          cargo nextest list --locked -p codex-tui -E "$FILTER" --message-format json > ../evidence/selected.json
      - name: Focused native regressions, without retries or snapshot updates
        run: |
          set -euo pipefail
          just test --locked -p codex-tui -E "$FILTER" --retries 0 --test-threads 2 \
            --status-level all --final-status-level all 2>&1 | tee evidence/tests.txt
      - name: Scoped Clippy
        run: just clippy --locked -p codex-tui -- -D warnings
      - name: Configure matching sandbox V8 artifacts for the release package
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build and finalize bundled bwrap before compiling its digest into Codex
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" -p codex-bwrap --bin bwrap
          bwrap_path="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          sha256sum "$bwrap_path" > ../evidence/bwrap.sha256
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Build exact staged GNU frontend and native companions
        working-directory: codex-rs
        run: |
          sha256sum "$RUSTY_V8_ARCHIVE" "$RUSTY_V8_SRC_BINDING_PATH" > ../evidence/rusty-v8.sha256
          cargo build --locked --release --target "$TARGET" \
            -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host
      - name: Package frontend and inspect ELF requirements, without activation
        run: |
          set -euo pipefail
          release="$CARGO_TARGET_DIR/$TARGET/release"
          CODEX_REPO_ROOT="$GITHUB_WORKSPACE" python3 scripts/build_codex_package.py \
            --target "$TARGET" --variant codex --cargo-profile release --package-dir package \
            --entrypoint-bin "$release/codex" \
            --code-mode-host-bin "$release/codex-code-mode-host" --bwrap-bin "$release/bwrap"
          sha256sum --check evidence/bwrap.sha256
          printf '%s  %s\n' "$CODEX_BWRAP_SHA256" package/codex-resources/bwrap | sha256sum --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- codex-rs .github scripts)"
          cp evidence/source.json package/source.json
          { file package/bin/codex; readelf -l package/bin/codex; readelf -d package/bin/codex; } > evidence/elf.txt
          sha256sum package/bin/codex > evidence/binary.sha256
          find package -type f -print0 | sort -z | xargs -0 sha256sum > evidence/package-files.sha256
          sha256sum scripts/build_codex_package.py scripts/codex_package/*.py \
            scripts/codex_package/rg scripts/codex_package/codex-zsh \
            .github/scripts/check_codex_package.py >> evidence/inputs.sha256
          tar -czf "evidence/codex-frontend-$TARGET.tar.gz" -C package .
          sha256sum "evidence/codex-frontend-$TARGET.tar.gz" > evidence/archive.sha256
      - name: Preflight the packaged native runtime without a model call
        run: |
          CODEX_REPO_ROOT="$GITHUB_WORKSPACE" python3 -m unittest discover \
            -s .github/scripts -p test_check_codex_package.py
          CODEX_REPO_ROOT="$GITHUB_WORKSPACE" python3 .github/scripts/check_codex_package.py \
            "evidence/codex-frontend-$TARGET.tar.gz" "$TARGET" evidence/package-preflight.json
      - name: Save sccache cache (fallback)
        id: cache_sccache_save
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.cache_sccache_save.outcome }}
        run: |
          mkdir -p evidence
          jq -n '{outcome:env.CACHE_SAVE_OUTCOME}' > evidence/cache-save.json
          sccache --show-stats 2>&1 | tee evidence/sccache.txt || true
      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        run: |
          {
            echo "### sccache stats — x86_64-unknown-linux-gnu (maintenance-baseline)";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain test results and actual counts
        if: always()
        run: |
          mkdir -p evidence
          if [[ -f codex-rs/target/nextest/local/junit.xml ]]; then
            cp codex-rs/target/nextest/local/junit.xml evidence/junit.xml
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('evidence')
          counts = {}
          for name in ('discovered', 'selected'):
              path = root / f'{name}.json'
              if path.exists():
                  try:
                      data = json.loads(path.read_text())
                  except json.JSONDecodeError:
                      counts[f'{name}_error'] = 'Incomplete or invalid discovery JSON; counts unknown'
                      continue
                  cases = [case for suite in data['rust-suites'].values() for case in suite['testcases'].values()]
                  counts[name] = len(cases) if name == 'discovered' else sum(case['filter-match']['status'] == 'matches' for case in cases)
                  counts[f'{name}_ignored'] = sum(case['ignored'] for case in cases if name == 'discovered' or case['filter-match']['status'] == 'matches')
                  if name == 'selected':
                      counts['filtered_out'] = sum(case['filter-match'].get('reason') == 'expression' for case in cases)
          path = root / 'junit.xml'
          if path.exists():
              cases = ET.parse(path).findall('.//testcase')
              counts['executed'] = sum(case.find('skipped') is None for case in cases)
              counts['skipped_in_junit'] = sum(case.find('skipped') is not None for case in cases)
              counts['failed'] = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
          (root / 'counts.json').write_text(json.dumps(counts, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: artifact
        if: always()
        with:
          name: codex-native-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error

  backend:
    if: github.repository == 'Smarty-Pants-Inc/codex' && (github.ref != 'refs/heads/ci/sense19-generators' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SENSE19_GENERATORS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ci/sense19-generators' }}
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      INSTA_UPDATE: 'no'
      PROJECTS: 'codex-protocol codex-state codex-goal-extension codex-core core_test_support codex-app-server'
      USE_SCCACHE: 'true'
      CARGO_INCREMENTAL: '0'
      SCCACHE_CACHE_SIZE: 10G
      # Keep cumulative compiler counters across the long core/app-server test phases.
      SCCACHE_IDLE_TIMEOUT: '0'
      # Command-tree timings, not pure compile/test time. The *-exit.txt files own status, including signals.
      CI_TIME_FORMAT: '{"elapsed_seconds":%e,"user_seconds":%U,"system_seconds":%S,"max_rss_kib":%M}'
    defaults:
      run:
        shell: bash
    steps:
      - name: Set disposable backend build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/codex-backend-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          # D must be one definition-only commit on fixed H; no arbitrary source input.
          fetch-depth: ${{ env.SENSE19_GENERATORS == 'true' && 2 || 1 }}
          persist-credentials: false
      - name: Verify fixed Sense19 source and retain definition D
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_source
        run: |
          set -euo pipefail
          source_exit=0
          bash -euxo pipefail > "$RUNNER_TEMP/sense19-source.stdout" 2> "$RUNNER_TEMP/sense19-source.stderr" <<'SH' || source_exit=$?
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD^)" = '7d77919ada3572407f75a4da81d0366484a49b04'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/smarty-ci.yml'
          test -z "$(git status --porcelain)"
          definition_tree="$(git rev-parse 'HEAD^{tree}')"
          cp .github/workflows/smarty-ci.yml "$RUNNER_TEMP/sense19-definition.yml"
          git checkout --detach '7d77919ada3572407f75a4da81d0366484a49b04'
          test "$(git rev-parse HEAD)" = '7d77919ada3572407f75a4da81d0366484a49b04'
          test "$(git rev-parse 'HEAD^{tree}')" = 'd940087ab4b8b392a9787ad9b4454af89d93a858'
          test -z "$(git status --porcelain)"
          test -f codex-rs/Cargo.lock
          jq -n --arg definition "$GITHUB_WORKFLOW_SHA" --arg definitionTree "$definition_tree" \
            --arg source '7d77919ada3572407f75a4da81d0366484a49b04' --arg tree 'd940087ab4b8b392a9787ad9b4454af89d93a858' --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg runner "$RUNNER_NAME" --arg os "$RUNNER_OS" --arg arch "$RUNNER_ARCH" \
            --arg account "$(id -un)" --arg uid "$(id -u)" \
            '{scope:"generator materialization, not H/Q/L acceptance",definition:$definition,definitionTree:$definitionTree,
              source:$source,tree:$tree,run:$run,attempt:$attempt,job:$job,event:$event,ref:$ref,
              runner:$runner,os:$os,arch:$arch,account:$account,uid:$uid,cleanInput:true}' > "$RUNNER_TEMP/sense19-input.json"
          SH
          mkdir -p backend-evidence/generator
          cp "$RUNNER_TEMP"/sense19-source.stdout "$RUNNER_TEMP"/sense19-source.stderr backend-evidence/generator/
          printf '%s\n' "$source_exit" > backend-evidence/generator/source-exit.txt
          test "$source_exit" = 0
          cp "$RUNNER_TEMP"/sense19-definition.yml "$RUNNER_TEMP"/sense19-input.json backend-evidence/generator/
          sha256sum codex-rs/Cargo.lock backend-evidence/generator/sense19-definition.yml > backend-evidence/generator/input.sha256
          echo 'PROJECTS=codex-app-server-protocol codex-app-server codex-core codex-goal-extension' >> "$GITHUB_ENV"
          cat > backend-evidence/generator/phase.sh <<'SH'
          phase() {
            local name="$1"; shift
            local output="$GITHUB_WORKSPACE/backend-evidence/generator/$name"
            local code=0
            mkdir -p "$output"
            printf '%q ' "$@" > "$output/command.txt"
            date -u +%FT%TZ > "$output/started.txt"
            /usr/bin/time -q -f "$CI_TIME_FORMAT" -o "$output/time.json" "$@" \
              > "$output/stdout.txt" 2> "$output/stderr.txt" || code=$?
            printf '%s\n' "$code" > "$output/exit.txt"
            date -u +%FT%TZ > "$output/completed.txt"
            if [[ "$code" != 0 ]]; then
              if [[ ! -f "$GITHUB_WORKSPACE/backend-evidence/generator/first-failure.txt" ]]; then
                printf '%s %s\n' "$name" "$code" > "$GITHUB_WORKSPACE/backend-evidence/generator/first-failure.txt"
              fi
              exit "$code"
            fi
          }
          SH
      - name: Validate CI phase receipt wiring without building Rust
        run: python3 -m unittest discover -s .github/scripts -p test_ci_phase_receipts.py
      - name: Record backend initial resources
        run: |
          mkdir -p backend-evidence
          {
            date -u +%FT%TZ
            nproc
            free -b
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } > backend-evidence/resources-start.txt 2>&1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.3'
          enable-cache: false
      - name: Existing pinned Bazel installer for generator branch
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          output-base: ${{ runner.temp }}/codex-bazel-output
      - name: Native Linux backend prerequisites (disposable runner only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Record backend source and toolchain
        run: |
          set -euo pipefail
          mkdir -p backend-evidence
          jq -n --arg commit "$(git rev-parse HEAD)" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg definition "$GITHUB_WORKFLOW_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" --arg projects "$PROJECTS" \
            '{commit:$commit,tree:$tree,definition:$definition,run:$run,attempt:$attempt,job:$job,
              projects:($projects|split(" ")),profile:"local",testThreads:2}' > backend-evidence/source.json
          { rustc -Vv; cargo -V; just --version; cargo nextest --version; uv --version; /usr/bin/time --version; uname -a; } > backend-evidence/tools.txt
          sha256sum codex-rs/Cargo.lock codex-rs/rust-toolchain.toml codex-rs/.config/nextest.toml \
            justfile scripts/format.py scripts/uv.lock sdk/python/uv.lock tools/buildifier \
            .github/workflows/smarty-ci.yml > backend-evidence/inputs.sha256
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.7.5
      - name: Verify sccache version
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: |
          version="$(sccache --version)"
          printf '%s\n' "$version" | tee backend-evidence/sccache-version.txt
          test "$version" = 'sccache 0.7.5'
      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi
      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
      - name: Record compiler cache restore
        if: always()
        env:
          CACHE_OUTCOME: ${{ steps.cache_sccache_restore.outcome }}
          CACHE_PRIMARY_KEY: ${{ steps.cache_sccache_restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache_sccache_restore.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.cache_sccache_restore.outputs.cache-hit }}
        run: |
          mkdir -p backend-evidence
          jq -n '{event:env.GITHUB_EVENT_NAME,ref:env.GITHUB_REF,
            gha_backend:env.SCCACHE_GHA_ENABLED,outcome:env.CACHE_OUTCOME,
            primary_key:env.CACHE_PRIMARY_KEY,matched_key:env.CACHE_MATCHED_KEY,
            exact_hit:env.CACHE_EXACT_HIT}' > backend-evidence/cache-restore.json
      - name: Configure matching sandbox V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Materialize Sense19 locks and both schemas
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_materialize
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/backend-evidence/generator/phase.sh"
          # Only this disposable runner's Bazel config; workspace/cache/remote policy stays intact.
          printf '\ncommon --jobs=2\n' >> "$HOME/.bazelrc"
          phase bazel-version bazel --version
          (cd codex-rs && phase cargo-metadata cargo metadata --format-version 1)
          phase bazel-lock just bazel-lock-update
          (cd codex-rs && phase normal-schema just write-app-server-schema)
          (cd codex-rs && phase experimental-schema just write-app-server-schema --experimental)
      - name: Build backend runtime test prerequisites
        if: ${{ env.SENSE19_GENERATORS != 'true' }}
        working-directory: codex-rs
        run: |
          set -euo pipefail
          sha256sum "$RUSTY_V8_ARCHIVE" "$RUSTY_V8_SRC_BINDING_PATH" \
            > ../backend-evidence/rusty-v8.sha256
          # Package-scoped nextest runs do not build sibling packages' executables.
          cargo build --locked \
            -p codex-cli --bin codex \
            -p codex-rmcp-client --bin test_stdio_server --bin test_streamable_http_server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-linux-sandbox --bin codex-linux-sandbox \
            -p codex-shell-escalation --bin codex-execve-wrapper \
            2>&1 | tee ../backend-evidence/runtime-prerequisites.txt
          for binary in codex test_stdio_server test_streamable_http_server codex-code-mode-host codex-linux-sandbox codex-execve-wrapper; do
            path="$CARGO_TARGET_DIR/debug/$binary"
            if [[ ! -x "$path" ]]; then
              echo "Missing runtime test executable: $path" >&2
              exit 1
            fi
            sha256sum "$path" >> ../backend-evidence/runtime-prerequisites.sha256
            echo "CARGO_BIN_EXE_$binary=$path" >> "$GITHUB_ENV"
            if [[ "$binary" == *-* ]]; then
              echo "CARGO_BIN_EXE_${binary//-/_}=$path" >> "$GITHUB_ENV"
            fi
          done
      - name: Scoped Sense19 and continuity fix and format
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_fix
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/backend-evidence/generator/phase.sh"
          packages=(codex-app-server codex-core codex-extension-api codex-goal-extension codex-queue-extension codex-state codex-analytics codex-app-server-protocol codex-cli codex-api codex-client core_test_support codex-exec codex-http-client codex-tui)
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          phase scoped-fix just fix --locked "${args[@]}" -- -D warnings
          phase format just fmt
          phase format-check just fmt-check
      - name: Bind affected checks to generated source tree
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_check_source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7d77919ada3572407f75a4da81d0366484a49b04'
          export GIT_INDEX_FILE="$RUNNER_TEMP/sense19-check.index"
          git read-tree '7d77919ada3572407f75a4da81d0366484a49b04'
          git add -A -- . ':!backend-evidence' ':!.sccache'
          tree="$(git write-tree)"
          printf '%s\n' "$tree" > backend-evidence/generator/checks-input-tree.txt
      - name: Generator runtime test prerequisites
        if: ${{ env.SENSE19_GENERATORS == 'true' }}
        id: generator_prerequisites
        working-directory: codex-rs
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/backend-evidence/generator/phase.sh"
          phase runtime-prerequisites bash -euo pipefail <<'SH'
          set -euo pipefail
          sha256sum "$RUSTY_V8_ARCHIVE" "$RUSTY_V8_SRC_BINDING_PATH" \
            > ../backend-evidence/rusty-v8.sha256
          # Package-scoped nextest runs do not build sibling packages' executables.
          cargo build --locked \
            -p codex-cli --bin codex \
            -p codex-rmcp-client --bin test_stdio_server --bin test_streamable_http_server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-linux-sandbox --bin codex-linux-sandbox \
            -p codex-shell-escalation --bin codex-execve-wrapper \
            2>&1 | tee ../backend-evidence/runtime-prerequisites.txt
          for binary in codex test_stdio_server test_streamable_http_server codex-code-mode-host codex-linux-sandbox codex-execve-wrapper; do
            path="$CARGO_TARGET_DIR/debug/$binary"
            if [[ ! -x "$path" ]]; then
              echo "Missing runtime test executable: $path" >&2
              exit 1
            fi
            sha256sum "$path" >> ../backend-evidence/runtime-prerequisites.sha256
            echo "CARGO_BIN_EXE_$binary=$path" >> "$GITHUB_ENV"
            if [[ "$binary" == *-* ]]; then
              echo "CARGO_BIN_EXE_${binary//-/_}=$path" >> "$GITHUB_ENV"
            fi
          done
          SH
      - name: Complete backend project tests
        id: backend_tests
        run: |
          set -euo pipefail
          failed=0
          for project in $PROJECTS; do
            selection=()
            retry_args=()
            if [[ "${SENSE19_GENERATORS:-false}" == true ]]; then
              retry_args=(--retries 0)
              case "$project" in
                codex-app-server-protocol) ;;
                codex-app-server) selection=(-E 'test(=observation_admission::tests::startup_lock_and_actual_origin_fence_admission) | test(=observation_admission::tests::connection_revocation_prevents_late_install_admission) | test(=thread_state::observation_lifecycle::tests::listener_clear_replace_and_drop_keep_core_binding_revoked) | test(=thread_state::observation_lifecycle::tests::conflicting_install_cannot_replace_core_binding) | test(=suite::v2::observation_lifecycle::observation_start_and_admitted_resume_install_fresh_owned_relays) | test(keep_working_requires_fresh_enable_after_human_input_resume_or_fork)') ;;
                codex-core) selection=(-E 'test(=suite::observation_transport::observation_clear_keeps_foreground_requests_full_context_http) | test(=suite::observation_retry::unchanged_retry_retains_a_and_completed_tool_retry_captures_b) | test(human_input_queue_and_manual_compaction_invalidate_at_admission)') ;;
                codex-goal-extension) selection=(-E 'test(boundaries_revoke_authority_without_restoring_it_from_storage) | test(new_input_revokes_a_stop_waiting_for_the_writer) | test(only_host_ready_replacement_retires_the_previous_runtime)') ;;
                *) echo "Unexpected generator project: $project" >&2; exit 1 ;;
              esac
            fi
            output="$GITHUB_WORKSPACE/backend-evidence/$project"
            mkdir -p "$output"
            printf '%s\n' "${selection[@]}" "${retry_args[@]}" > "$output/selection.txt"
            date -u +%FT%TZ > "$output/started.txt"
            # Each project overwrites the local-profile JUnit path; never reuse a previous result.
            rm -f codex-rs/target/nextest/local/junit.xml
            discovery_exit=0
            (cd codex-rs && /usr/bin/time -q -f "$CI_TIME_FORMAT" -o "$output/discovery-time.json" \
              cargo nextest list --locked -p "$project" "${selection[@]}" --message-format json) \
              > "$output/discovered.json" 2> "$output/discovery.txt" || discovery_exit=$?
            echo "$discovery_exit" > "$output/discovery-exit.txt"
            if [[ "${SENSE19_GENERATORS:-false}" == true && "$discovery_exit" != 0 && ! -f backend-evidence/generator/first-failure.txt ]]; then
              printf '%s discovery %s\n' "$project" "$discovery_exit" > backend-evidence/generator/first-failure.txt
            fi
            if [[ "$discovery_exit" != 0 ]]; then
              failed=1
              continue
            fi
            test_exit=0
            /usr/bin/time -q -f "$CI_TIME_FORMAT" -o "$output/test-time.json" \
              just test --locked -p "$project" "${selection[@]}" "${retry_args[@]}" --test-threads 2 \
              --status-level all --final-status-level all 2>&1 | tee "$output/tests.txt" || test_exit=$?
            echo "$test_exit" > "$output/test-exit.txt"
            if [[ "${SENSE19_GENERATORS:-false}" == true && "$test_exit" != 0 && ! -f backend-evidence/generator/first-failure.txt ]]; then
              printf '%s test %s\n' "$project" "$test_exit" > backend-evidence/generator/first-failure.txt
            fi
            if [[ -s codex-rs/target/nextest/local/junit.xml ]]; then
              cp codex-rs/target/nextest/local/junit.xml "$output/junit.xml"
            else
              failed=1
              if [[ "${SENSE19_GENERATORS:-false}" == true && ! -f backend-evidence/generator/first-failure.txt ]]; then
                printf '%s missing-junit 1\n' "$project" > backend-evidence/generator/first-failure.txt
              fi
            fi
            date -u +%FT%TZ > "$output/completed.txt"
            if [[ "$test_exit" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Scoped backend Clippy
        if: ${{ env.SENSE19_GENERATORS != 'true' }}
        run: |
          set -euo pipefail
          failed=0
          for project in $PROJECTS; do
            lint_exit=0
            /usr/bin/time -q -f "$CI_TIME_FORMAT" -o "backend-evidence/$project/clippy-time.json" \
              just clippy --locked -p "$project" -- -D warnings \
              2>&1 | tee "backend-evidence/$project/clippy.txt" || lint_exit=$?
            echo "$lint_exit" > "backend-evidence/$project/clippy-exit.txt"
            if [[ "$lint_exit" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Full formatter check (pinned Rust and locked Python tools)
        if: ${{ env.SENSE19_GENERATORS != 'true' }}
        run: just fmt-check
      - name: Verify backend source unchanged
        if: ${{ env.SENSE19_GENERATORS != 'true' }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- codex-rs .github scripts sdk tools justfile)"
      - name: Retain per-project backend counts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('backend-evidence')
          root.mkdir(exist_ok=True)
          counts = {}
          for project in os.environ['PROJECTS'].split():
              output = root / project
              result = {}
              for phase in ('discovery', 'test', 'clippy'):
                  path = output / f'{phase}-exit.txt'
                  result[f'{phase}_exit'] = int(path.read_text()) if path.exists() else None
              path = output / 'discovered.json'
              if path.exists():
                  try:
                      data = json.loads(path.read_text())
                      cases = [case for suite in data['rust-suites'].values() for case in suite['testcases'].values()]
                      result['discovered'] = len(cases)
                      result['selected'] = sum(case['filter-match']['status'] == 'matches' for case in cases)
                      result['ignored'] = sum(case['ignored'] for case in cases)
                      result['filtered_out'] = sum(case['filter-match'].get('reason') == 'expression' for case in cases)
                  except (json.JSONDecodeError, KeyError):
                      result['discovery_error'] = 'Incomplete discovery; counts unknown'
              path = output / 'junit.xml'
              if path.exists():
                  cases = ET.parse(path).findall('.//testcase')
                  result['executed'] = sum(case.find('skipped') is None for case in cases)
                  result['skipped_in_junit'] = sum(case.find('skipped') is not None for case in cases)
                  result['failed'] = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
                  result['passed'] = result['executed'] - result['failed']
              counts[project] = result
          (root / 'counts.json').write_text(json.dumps(counts, indent=2) + '\n')
          PY
      - name: Save sccache cache (fallback)
        id: cache_sccache_save
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-smarty-v2-0.7.5-ubuntu24-x64-gnu-${{ github.job }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}
      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.cache_sccache_save.outcome }}
        run: |
          mkdir -p backend-evidence
          jq -n '{outcome:env.CACHE_SAVE_OUTCOME}' > backend-evidence/cache-save.json
          sccache --show-stats 2>&1 | tee backend-evidence/sccache.txt || true
      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        run: |
          {
            echo "### sccache stats — x86_64-unknown-linux-gnu (backend)";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain generated or partial repair source even on failure
        if: ${{ always() && env.SENSE19_GENERATORS == 'true' }}
        id: generator_capture
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p backend-evidence/generator
          printf '%s\n' "$STEP_RESULTS" > backend-evidence/generator/steps.json
          if [[ ! -f backend-evidence/generator/source-exit.txt || "$(<backend-evidence/generator/source-exit.txt)" != 0 ]]; then
            echo 'Input not verified; no output source tree claimed.' > backend-evidence/generator/output-unavailable.txt
            exit 1
          fi
          test "$(git rev-parse HEAD)" = '7d77919ada3572407f75a4da81d0366484a49b04'
          export GIT_INDEX_FILE="$RUNNER_TEMP/sense19-output.index"
          git read-tree '7d77919ada3572407f75a4da81d0366484a49b04'
          git add -A -- . ':!backend-evidence' ':!.sccache'
          git diff --cached --binary '7d77919ada3572407f75a4da81d0366484a49b04' > backend-evidence/generator/generated.diff
          git diff --cached --name-status '7d77919ada3572407f75a4da81d0366484a49b04' > backend-evidence/generator/changed-paths.txt
          git write-tree > backend-evidence/generator/output-tree.txt
          sha256sum backend-evidence/generator/generated.diff > backend-evidence/generator/generated.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('backend-evidence/generator')
          phases = ('bazel-version', 'cargo-metadata', 'bazel-lock', 'normal-schema', 'experimental-schema',
                    'runtime-prerequisites', 'scoped-fix', 'format', 'format-check')
          results = {name: int((root / name / 'exit.txt').read_text()) if (root / name / 'exit.txt').exists()
                     else None for name in phases}
          (root / 'phase-exits.json').write_text(json.dumps(results, indent=2) + '\n')
          PY
          if [[ -f backend-evidence/generator/checks-input-tree.txt ]]; then
            if ! cmp -s backend-evidence/generator/checks-input-tree.txt backend-evidence/generator/output-tree.txt; then
              if [[ ! -f backend-evidence/generator/first-failure.txt ]]; then
                echo 'post-check-source-drift 1' > backend-evidence/generator/first-failure.txt
              fi
              echo false > backend-evidence/generator/checks-source-unchanged.txt
              exit 1
            fi
            echo true > backend-evidence/generator/checks-source-unchanged.txt
          fi
      - name: Record backend final resources
        if: always()
        run: |
          mkdir -p backend-evidence
          failed=0
          {
            date -u +%FT%TZ || failed=1
            free -b || failed=1
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || failed=1
            if [[ ! -f backend-evidence/resources-start.txt ]]; then
              echo 'Initial resource receipt absent; initial phase did not complete.'
            fi
            for path in "${CARGO_TARGET_DIR:-}" "$GITHUB_WORKSPACE/backend-evidence"; do
              if [[ -e "$path" ]]; then
                du -sxB1 "$path" || failed=1
              else
                printf 'Path absent (not measured): %s\n' "$path"
              fi
            done
          } > backend-evidence/resources-final.txt 2>&1
          exit "$failed"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: codex-backend-${{ github.sha }}-${{ github.run_attempt }}
          path: backend-evidence/
          retention-days: 1
          if-no-files-found: error

  required:
    name: smarty-ci
    if: ${{ always() && github.repository == 'Smarty-Pants-Inc/codex' && github.ref != 'refs/heads/ci/sense19-generators' }}
    needs: [maintenance-baseline, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require baseline and backend success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
