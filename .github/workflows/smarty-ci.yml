name: smarty-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - mergify/merge-queue/**
      - tmp-mergify/merge-queue/**

permissions:
  contents: read

concurrency:
  group: smarty-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smarty-ci:
    name: smarty-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record Core source
        run: |
          mkdir -p "$RUNNER_TEMP/observation-capacity"
          git show -s --format='%H %T %P' HEAD | tee "$RUNNER_TEMP/observation-capacity/source-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Record Core tools
        run: |
          set -euo pipefail
          {
            rustc -Vv
            cargo --version
            just --version
            cargo nextest --version
            dotslash --version
            uv --version
          } 2>&1 | tee "$RUNNER_TEMP/observation-capacity/tools.log"
      - name: Install Linux sandbox build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Check bubblewrap netlink replies
        working-directory: codex-rs/bwrap
        run: |
          test_binary="$(mktemp)"
          trap 'rm -f "$test_binary"' EXIT
          cc -std=gnu11 -Wall -Wextra -ffunction-sections -fdata-sections \
            -I. -I../vendor/bubblewrap -Wl,--gc-sections \
            tests/netlink_reply.c -o "$test_binary"
          "$test_binary"
      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test codex-bwrap
        working-directory: codex-rs
        run: |
          # The crate has no Rust tests; C29 above supplies behavioral coverage.
          just test -p codex-bwrap --locked --no-tests=pass --retries 0 --test-threads 2
      - name: Record native Linux resource and dependency identity
        run: |
          set -euo pipefail
          {
            test "$(uname -m)" = x86_64
            . /etc/os-release
            test "$ID" = ubuntu
            test "$VERSION_ID" = 24.04
            uname -a
            df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            free -m
            sha256sum MODULE.bazel MODULE.bazel.lock codex-rs/Cargo.lock codex-rs/Cargo.toml
          } 2>&1 | tee "$RUNNER_TEMP/observation-capacity/resources.log"
      - name: Supply integrity-bound readonly capacity DATA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat
          source = pathlib.Path('codex-rs/core/tests/fixtures/observation_capacity')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observation-capacity-input'
          target.mkdir(mode=0o700)
          manifest = (source / 'MANIFEST.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == '14cea29a0d559b5424e8ab0c53b3e22adf561353e6eceb0e9c07ea2d59c05c8b'
          records = json.loads(manifest)['cases']
          expected = {f'{label}-{watches}x2048.frame.txt' for label in ('apostrophe', 'quote', 'backslash', 'ampersand') for watches in (4, 8)}
          assert len(records) == 8 and {case['text']['name'] for case in records} == expected
          members = []
          for name, length, digest in [('MANIFEST.json', len(manifest), hashlib.sha256(manifest).hexdigest())] + [(c['text']['name'], c['text']['bytes'], c['text']['sha256']) for c in records]:
              path = source / name
              metadata = path.lstat()
              assert stat.S_ISREG(metadata.st_mode) and metadata.st_size == length and length <= 35000
              data = path.read_bytes()
              assert len(data) == length and hashlib.sha256(data).hexdigest() == digest
              with (target / name).open('xb') as output:
                  output.write(data)
              (target / name).chmod(0o400)
              members.append({'name': name, 'bytes': length, 'sha256': digest})
          target.chmod(0o500)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observation-capacity'
          (evidence / 'fixtures.json').write_text(json.dumps(members, indent=2) + '\n')
          PY
      - name: Compile Core library and execute exact ignored native capacity probe
        working-directory: codex-rs
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/observation-capacity/report.json"
          export CODEX_OBSERVATION_CAPACITY_FIXTURES="$RUNNER_TEMP/observation-capacity-input"
          export CODEX_OBSERVATION_CAPACITY_REPORT="$RUNNER_TEMP/observation-capacity/report.json"
          just test -p codex-core --lib \
            -E 'test(=context::current_observations::tests::capacity_probe_tests::original_multiview_serializer_native_framing_counterexamples)' \
            --run-ignored only --locked --retries 0 --test-threads 1 \
            2>&1 | tee "$RUNNER_TEMP/observation-capacity/core-test.log"
      - name: Validate complete finite count report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observation-capacity'
          report = evidence / 'report.json'
          assert report.stat().st_size <= 16384
          rows = json.loads(report.read_bytes())
          expected = {f'{label}-{watches}x2048.frame.txt' for label in ('apostrophe', 'quote', 'backslash', 'ampersand') for watches in (4, 8)}
          assert len(rows) == 8 and {r['fixture'] for r in rows} == expected
          for row in rows:
              assert set(row) == {'fixture', 'rawBytes', 'renderedBytes', 'framedBytes', 'framedSha256', 'tokens', 'below10000', 'productionAdmission', 'positiveUniversalBound'}
              assert all(type(row[key]) is int and 0 < row[key] <= 1000000 for key in ('rawBytes', 'renderedBytes', 'framedBytes', 'tokens'))
              assert re.fullmatch('[0-9a-f]{64}', row['framedSha256'])
              assert type(row['below10000']) is bool and row['below10000'] == (row['tokens'] < 10000)
              assert row['productionAdmission'] == 'rejected-unchanged4096' and row['positiveUniversalBound'] is False
          # Retain actual named output, not merely a zero exit or zero-tests pass.
          log = re.sub(r'\x1b\[[0-9;]*m', '', (evidence / 'core-test.log').read_text())
          name = 'context::current_observations::tests::capacity_probe_tests::original_multiview_serializer_native_framing_counterexamples'
          assert len([line for line in log.splitlines() if 'PASS' in line and name in line]) == 1
          assert re.search(r'1 test run: 1 passed', log)
          PY
      - name: Return complete Core source and test evidence
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/observation-capacity"
          mkdir -p "$evidence"
          git show -s --format='%H %T %P' HEAD > "$evidence/source-after.txt"
          git diff --binary > "$evidence/source.patch"
          git diff --cached --binary > "$evidence/index.patch"
          git status --porcelain=v1 --untracked-files=all > "$evidence/status-after.txt"
          cp MODULE.bazel.lock "$evidence/MODULE.bazel.lock"
          sha256sum MODULE.bazel.lock codex-rs/Cargo.lock .github/workflows/smarty-ci.yml > "$evidence/source-after.sha256"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'observation-capacity'
          allowed = {'source-before.txt', 'tools.log', 'resources.log', 'fixtures.json', 'core-test.log', 'report.json', 'source-after.txt', 'source.patch', 'index.patch', 'status-after.txt', 'MODULE.bazel.lock', 'source-after.sha256'}
          paths = list(root.iterdir())
          assert all(p.name in allowed and p.is_file() and not p.is_symlink() for p in paths)
          assert sum(p.stat().st_size for p in paths) <= 24 * 1024 * 1024
          members = [{'name': p.name, 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(paths)]
          (root / 'members.json').write_text(json.dumps(members, indent=2) + '\n')
          PY
      - name: Upload Core capacity evidence (not runtime qualification)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: observation-core-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation-capacity/
          if-no-files-found: error
          retention-days: 7
      - name: Check source remains unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
