name: Codex cumulative workspace-build diagnostic

on:
  push:
    branches:
      - diagnostic/workspace-build-106f-1

permissions:
  contents: read

concurrency:
  group: codex-workspace-build-106f-once
  cancel-in-progress: false

jobs:
  smarty-ci:
    name: codex-diagnostic / Core then workspace build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 106f78e3757e47b5b7e76b8fea96c29096cd93cd
          persist-credentials: false
      - name: Verify exact diagnostic definition and executed source
        env:
          DEFINITION_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/diagnostic/workspace-build-106f-1
          test "$DEFINITION_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = 106f78e3757e47b5b7e76b8fea96c29096cd93cd
          test "$(git rev-parse HEAD^{tree})" = 9a75edc19194ea03f447b6a8f9d449ddba287e68
          printf 'definition=%s executed=%s tree=%s\n' "$DEFINITION_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Install Linux sandbox build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      - name: Check bubblewrap netlink replies
        working-directory: codex-rs/bwrap
        run: |
          test_binary="$(mktemp)"
          trap 'rm -f "$test_binary"' EXIT
          cc -std=gnu11 -Wall -Wextra -ffunction-sections -fdata-sections \
            -I. -I../vendor/bubblewrap -Wl,--gc-sections \
            tests/netlink_reply.c -o "$test_binary"
          "$test_binary"
      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Configure namespace prerequisites on the disposable Linux runner
        run: |
          set -euo pipefail
          # Match setup-ci's namespace prerequisite; this changes policy for this job VM.
          sysctl kernel.unprivileged_userns_clone
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          fi
      - name: Configure verified V8 artifacts for runtime test helpers
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Make DotSlash available in stable PATH
        run: |
          if [[ -w /usr/local/bin ]]; then
            cp "$(which dotslash)" /usr/local/bin
          else
            sudo cp "$(which dotslash)" /usr/local/bin
          fi
      - name: Observe disk after setup
        run: python3 .github/scripts/ci_disk_observation.py after-setup
      - name: Check Core fix and format readiness without changing the candidate
        working-directory: codex-rs
        run: |
          status=0
          just fix -p codex-core --locked -- -D warnings || status=1
          cargo fmt -- --config imports_granularity=Item --check || status=1
          git -C .. diff --exit-code || status=1
          git -C .. diff --cached --exit-code || status=1
          untracked="$(git -C .. ls-files --others --exclude-standard)"
          if test -n "$untracked"; then
            printf 'Unexpected untracked files:\n%s\n' "$untracked"
            status=1
          fi
          exit "$status"
      - name: Build runtime test helpers
        working-directory: codex-rs
        run: cargo build --locked -p codex-cli -p codex-exec -p codex-code-mode-host -p codex-linux-sandbox -p codex-rmcp-client -p codex-shell-escalation --bins
      - name: Observe disk after runtime helpers
        run: python3 .github/scripts/ci_disk_observation.py after-helpers
      - name: Observe disk before full Core
        run: python3 .github/scripts/ci_disk_observation.py pre-full-core
      - name: Test codex-core source contract
        working-directory: codex-rs
        run: python3 ../.github/scripts/ci_disk_observation.py run full-core just test -p codex-core --locked --retries 0 --test-threads 2 --success-output final
      - name: Observe disk before workspace binary compilation
        run: python3 .github/scripts/ci_disk_observation.py pre-workspace-build
      - name: Compile workspace test binaries without running tests
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
          NEXTEST_PROFILE: local
        run: |
          python3 ../.github/scripts/ci_disk_observation.py run workspace-build \
            bash -c 'exec cargo nextest list --locked --list-type binaries-only --message-format json > "$RUNNER_TEMP/workspace-binaries.json"'
      - name: Check source remains unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
