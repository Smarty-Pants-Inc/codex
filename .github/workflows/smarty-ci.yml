name: smarty-ci
'on':
  workflow_dispatch:
    inputs:
      workflow_sha256:
        description: Selected SHA-256 of this exact workflow
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    name: transport (test)
    if: github.repository == 'Smarty-Pants-Inc/codex' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualify/transport-d28-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '0'
      EXPECTED_WORKFLOW_SHA256: ${{ inputs.workflow_sha256 }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      PHASE: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record generation source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1047329867
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$WORKFLOW_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d28c83b6b9e6111aad784c6bc8872f12d7e4b23f
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/smarty-ci.yml
          [[ "$EXPECTED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_WORKFLOW_SHA256" .github/workflows/smarty-ci.yml | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/transport-generation"
          git show -s --format='%H %T %P' HEAD | tee "$RUNNER_TEMP/transport-generation/source-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          cp codex-rs/Cargo.lock "$RUNNER_TEMP/transport-generation/Cargo.before.lock"
          cp MODULE.bazel.lock "$RUNNER_TEMP/transport-generation/MODULE.before.bazel.lock"
          sha256sum codex-rs/Cargo.lock MODULE.bazel.lock .github/workflows/smarty-ci.yml >> "$RUNNER_TEMP/transport-generation/source-before.txt"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy,rust-src
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
          enable-cache: false
      - name: Record generation tools
        run: |
          set -euo pipefail
          {
            uname -a
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            test "$(cat .bazelversion)" = 9.0.0
            bazel_version="$(bazel --version)"
            echo "$bazel_version"
            test "$bazel_version" = 'bazel 9.0.0'
            rustc -Vv
            test "$(rustc -Vv | awk '/^release:/ { print $2 }')" = 1.95.0
            cargo --version
            test "$(cargo --version | awk '{ print $2 }')" = 1.95.0
            just --version
            cargo nextest --version
            dotslash --version
            uv --version
          } 2>&1 | tee "$RUNNER_TEMP/transport-generation/tools.log"
      - name: Install Linux sandbox build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Generate and guard exact lock closure
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/transport-generation"
          just bazel-lock-update 2>&1 | tee "$evidence/bazel-lock-update.log"
          just bazel-lock-check 2>&1 | tee "$evidence/bazel-lock-check.log"
          cmp codex-rs/Cargo.lock "$evidence/Cargo.before.lock"
          cmp MODULE.bazel.lock "$evidence/MODULE.before.bazel.lock"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Check bubblewrap netlink replies
        working-directory: codex-rs/bwrap
        run: |
          test_binary="$(mktemp)"
          trap 'rm -f "$test_binary"' EXIT
          cc -std=gnu11 -Wall -Wextra -ffunction-sections -fdata-sections \
            -I. -I../vendor/bubblewrap -Wl,--gc-sections \
            tests/netlink_reply.c -o "$test_binary"
          "$test_binary"
      - name: Check Rust formatting
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test codex-bwrap
        working-directory: codex-rs
        run: |
          # The crate has no Rust tests; C29 above supplies behavioral coverage.
          just test -p codex-bwrap --locked --no-tests=pass --retries 0 --test-threads 2
      - name: Test transport packages
        working-directory: codex-rs
        run: |
          set -euo pipefail
          RUST_MIN_STACK=8388608 NEXTEST_PROFILE=local cargo nextest list \
            -p codex-http-client -p codex-client -p codex-api --locked --message-format json \
            | tee "$RUNNER_TEMP/transport-generation/package-inventory.json"
          just test -p codex-http-client -p codex-client -p codex-api --locked --retries 0 --test-threads 2 \
            2>&1 | tee "$RUNNER_TEMP/transport-generation/package-tests.log"
      - name: Preserve original and generated closure DATA
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/transport-generation"
          mkdir -p "$evidence"
          git show -s --format='%H %T %P' HEAD > "$evidence/source-after.txt"
          git write-tree >> "$evidence/source-after.txt"
          sha256sum codex-rs/Cargo.lock MODULE.bazel.lock .github/workflows/smarty-ci.yml >> "$evidence/source-after.txt"
          cp codex-rs/Cargo.lock "$evidence/Cargo.after.lock"
          cp MODULE.bazel.lock "$evidence/MODULE.after.bazel.lock"
          git diff --binary HEAD > "$evidence/generated.patch"
          git status --porcelain=v1 --untracked-files=all > "$evidence/status-after.txt"
          if test -s "$evidence/generated.patch" || test -s "$evidence/status-after.txt"; then
            echo 'CHANGED SOURCE: DATA ONLY; no test/fix qualification or automatic adoption.' > "$evidence/qualification.txt"
          else
            echo 'No source delta; qualification requires every selected step and both jobs to succeed.' > "$evidence/qualification.txt"
          fi
      - name: Bound phase evidence
        id: evidence-bound
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "transport-generation"
          allowed = {'package-tests.log', 'status-after.txt', 'MODULE.after.bazel.lock', 'source-before.txt', 'generated.patch', 'Cargo.after.lock', 'tools.log', 'package-inventory.json', 'source-after.txt', 'bazel-lock-update.log', 'bazel-lock-check.log', 'Cargo.before.lock', 'MODULE.before.bazel.lock', 'qualification.txt'}
          files = list(root.iterdir())
          if not files or len(files) > 15 or any(p.name not in allowed or p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit("REFUSE: unexpected evidence member")
          if sum(p.stat().st_size for p in files) > 24 * 1024 * 1024:
              raise SystemExit("REFUSE: evidence exceeds 24 MiB; retain original RAW, do not truncate")
          PY
      - name: Upload bounded phase DATA
        if: always() && steps.evidence-bound.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: transport-closure-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: ${{ runner.temp }}/transport-generation/
          if-no-files-found: error
          retention-days: 7
      - name: Check source remains unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  fix:
