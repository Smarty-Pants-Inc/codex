name: smarty-ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarty-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smarty-ci:
    name: smarty-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record generation source
        run: |
          mkdir -p "$RUNNER_TEMP/transport-generation"
          git show -s --format='%H %T %P' HEAD | tee "$RUNNER_TEMP/transport-generation/source-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Record generation tools
        run: |
          set -euo pipefail
          {
            test "$(cat .bazelversion)" = 9.0.0
            bazel_version="$(bazel --version)"
            echo "$bazel_version"
            test "$bazel_version" = 'bazel 9.0.0'
            rustc -Vv
            cargo --version
            just --version
            cargo nextest --version
            dotslash --version
            uv --version
          } 2>&1 | tee "$RUNNER_TEMP/transport-generation/tools.log"
      - name: Install Linux sandbox build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Check bubblewrap netlink replies
        working-directory: codex-rs/bwrap
        run: |
          test_binary="$(mktemp)"
          trap 'rm -f "$test_binary"' EXIT
          cc -std=gnu11 -Wall -Wextra -ffunction-sections -fdata-sections \
            -I. -I../vendor/bubblewrap -Wl,--gc-sections \
            tests/netlink_reply.c -o "$test_binary"
          "$test_binary"
      - name: Generate canonical config schema
        shell: bash
        run: |
          set -euo pipefail
          just write-config-schema 2>&1 | tee "$RUNNER_TEMP/transport-generation/config-generator.log"
      - name: Check generated schema whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- codex-rs/core/config.schema.json 2>&1 | tee "$RUNNER_TEMP/transport-generation/schema-diff-check.log"
      - name: Test canonical config schema
        shell: bash
        run: |
          set -euo pipefail
          RUST_MIN_STACK=8388608 NEXTEST_PROFILE=local cargo nextest list --manifest-path codex-rs/Cargo.toml -p codex-core --lib --locked --message-format json -- config::schema::tests > "$RUNNER_TEMP/transport-generation/schema-inventory.json" 2> "$RUNNER_TEMP/transport-generation/schema-inventory.stderr"
          just test -p codex-core --lib --locked --no-tests=fail -- config::schema::tests 2>&1 | tee "$RUNNER_TEMP/transport-generation/schema-tests.log"
      - name: Return bounded schema evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/transport-generation"
          git show -s --format='%H %T %P' HEAD > "$out/source-after.txt"
          git diff --binary > "$out/source.patch"
          git diff --cached --binary > "$out/index.patch"
          git status --porcelain=v1 --untracked-files=all > "$out/status.txt"
          cp codex-rs/core/config.schema.json "$out/config.schema.json"
          sha256sum codex-rs/core/config.schema.json codex-rs/Cargo.lock MODULE.bazel.lock > "$out/schema-hashes.txt"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'transport-generation'
          names = ['source-before.txt', 'source-after.txt', 'tools.log', 'config-generator.log', 'schema-diff-check.log', 'schema-tests.log', 'schema-inventory.json', 'schema-inventory.stderr', 'source.patch', 'index.patch', 'status.txt', 'config.schema.json', 'schema-hashes.txt']
          entries = []
          total = 0
          for name in names:
              p = root / name
              if not p.exists():
                  entries.append({'name': name, 'missing': True})
                  continue
              if p.is_symlink() or not p.is_file():
                  raise RuntimeError('nonregular evidence')
              size = p.stat().st_size
              total += size
              if size > 16 * 1024 * 1024 or total > 48 * 1024 * 1024:
                  raise RuntimeError('evidence cap exceeded; no truncation')
              entries.append({'name': name, 'bytes': size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          (root / 'manifest.json').write_text(json.dumps({'entries': entries, 'qualification_awarded': False}, indent=2))
          PY
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git diff --name-only -- . ':!codex-rs/core/config.schema.json')"
      - name: Upload schema evidence only
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readiness-config-schema
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/transport-generation/source-before.txt
            ${{ runner.temp }}/transport-generation/source-after.txt
            ${{ runner.temp }}/transport-generation/tools.log
            ${{ runner.temp }}/transport-generation/config-generator.log
            ${{ runner.temp }}/transport-generation/schema-diff-check.log
            ${{ runner.temp }}/transport-generation/schema-tests.log
            ${{ runner.temp }}/transport-generation/schema-inventory.json
            ${{ runner.temp }}/transport-generation/schema-inventory.stderr
            ${{ runner.temp }}/transport-generation/source.patch
            ${{ runner.temp }}/transport-generation/index.patch
            ${{ runner.temp }}/transport-generation/status.txt
            ${{ runner.temp }}/transport-generation/config.schema.json
            ${{ runner.temp }}/transport-generation/schema-hashes.txt
            ${{ runner.temp }}/transport-generation/manifest.json
