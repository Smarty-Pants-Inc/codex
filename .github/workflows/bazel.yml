name: Bazel

# Note this workflow was originally derived from:
# https://github.com/cerisier/toolchains_llvm_bootstrapped/blob/main/.github/workflows/ci.yaml

on:
  workflow_dispatch:

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Qualification-only snapshot: not for ordinary PR or landing.
# Unselected jobs are explicitly unrun; no aggregate is awarded.
env:
  BUILDBUDDY_API_KEY: ""

jobs:
  test:
    permissions:
      contents: read
      actions: read
    # PRs use the sharded Windows cross-compiled test jobs below. Post-merge
    # pushes to main also run the native Windows test job for broader Windows
    # signal without putting PR latency back on the critical path. When
    # Code-mode unit tests run on every Bazel target. When authenticated RBE
    # is available, the Windows-cross shards exercise the source-built V8 path.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-15
            target: aarch64-apple-darwin

          # 2026-02-27 Bazel tests have been flaky on arm in CI.
          # Disable until we can investigate and stabilize them.
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-musl
          # - os: ubuntu-24.04-arm
          #   target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    # Configure a human readable name for each job
    name: Bazel test on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - name: Record standard Mac fit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test -z "${BUILDBUDDY_API_KEY:-}"
          printf 'source=%s job=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          sw_vers
          sysctl hw.ncpu hw.memsize
          df -h
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          printf 'Cross-target x86_64 on ARM is not native Intel coverage.\n'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        timeout-minutes: 5
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: Identify exact native action cache
        id: action_cache_identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = qualify/observation-transport-macos-cache-stage1
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$ImageVersion" = 20260907.0337.1
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          test "$(xcrun --show-sdk-version)" = 15.5
          test "$(bazel --version)" = 'bazel 9.0.0'
          test -z "${BUILDBUDDY_API_KEY:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          graph = hashlib.sha256(b''.join(Path(p).read_bytes() for p in ('.bazelrc', '.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', '.github/workflows/bazel.yml'))).hexdigest()
          identity = {k: os.environ[k] for k in ('GITHUB_SHA', 'GITHUB_REF_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageVersion')}
          identity.update(tree=source, graph=graph, xcode='16.4', sdk='15.5', bazel='9.0.0', command='original-full-bazel-test-no-key-v1')
          body = json.dumps(identity, sort_keys=True)
          key = 'codex-trusted-macos-action-v1-' + hashlib.sha256(body.encode()).hexdigest()
          print(body)
          print('cache-key=' + key)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=' + key + '\n')
          PY

      - name: Restore exact native action cache
        id: restore_action_cache
        timeout-minutes: 5
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ steps.action_cache_identity.outputs.key }}

      - name: Validate exact cache and command budget
        id: action_cache_gate
        shell: bash
        env:
          EXPECTED: ${{ steps.action_cache_identity.outputs.key }}
          PRIMARY: ${{ steps.restore_action_cache.outputs.cache-primary-key }}
          MATCHED: ${{ steps.restore_action_cache.outputs.cache-matched-key }}
          HIT: ${{ steps.restore_action_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED" && test "$PRIMARY" = "$EXPECTED"
          if [[ "$HIT" == true ]]; then
            test "$MATCHED" = "$EXPECTED"
            echo 'Exact cache hit: original full command, inner30/outer30. No retry.'
          elif [[ "$HIT" == false || -z "$HIT" ]]; then
            test -z "$MATCHED"
            echo 'Cold cache miss: original full command, inner20/outer30. Incomplete remains failure.'
          else
            echo 'Malformed cache-hit value; no build allowed.' >&2
            exit 1
          fi

      - name: Require real repository cache headroom
        if: steps.restore_action_cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > "$RUNNER_TEMP/cache-usage-before.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/storage-limit" > "$RUNNER_TEMP/cache-limit-before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          used = json.loads((root / 'cache-usage-before.json').read_text())['active_caches_size_in_bytes']
          configured = json.loads((root / 'cache-limit-before.json').read_text())['max_cache_size_gb']
          if type(configured) is not int or configured != 10 or type(used) is not int or used < 0:
              raise SystemExit('Quota envelope drift or invalid usage; no build/save allowed')
          limit = 10_000_000_000
          required = 4 * 1024**3 + 64 * 1024**2
          print(f'Conservative decimal quota={limit}, used={used}, required free={required}')
          if limit - used < required:
              raise SystemExit('Insufficient actual cache headroom; no compile/save/automatic eviction')
          PY

      - name: bazel test //...
        id: full_test
        timeout-minutes: ${{ steps.restore_action_cache.outputs.cache-hit == 'true' && 30 || 20 }}
        env:
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_wrapper_args=(
            --print-failed-action-summary
            --print-failed-test-logs
          )
          bazel_test_args=(
            test
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
          )
          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Stop Bazel before cache snapshot
        id: stop_bazel
        if: always() && !cancelled() && steps.action_cache_gate.outcome == 'success' && steps.full_test.outcome != 'skipped'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          pidfile="$BAZEL_OUTPUT_BASE/server/server.pid.txt"
          server_pid=''
          if [[ -f "$pidfile" ]]; then server_pid="$(<"$pidfile")"; fi
          export SNAPSHOT_SERVER_PID="$server_pid"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = os.environ['SNAPSHOT_SERVER_PID']
          processes = [line.split(None, 2) for line in subprocess.check_output(['ps', '-axo', 'pid=,ppid=,command='], text=True).splitlines()]
          owned = {root} if root else set()
          while True:
              children = {pid for pid, parent, command in processes if parent in owned}
              if children <= owned:
                  break
              owned |= children
          record = {pid: command for pid, parent, command in processes if pid in owned}
          if root not in record:
              raise SystemExit('Cannot identify live Bazel server before shutdown; no cache snapshot')
          (Path(os.environ['RUNNER_TEMP']) / 'bazel-owned-processes.json').write_text(json.dumps(record))
          print('Recorded Bazel server/worker PIDs:', sorted(record))
          PY
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" --output_base="$BAZEL_OUTPUT_BASE" shutdown
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          owned = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bazel-owned-processes.json').read_text())
          live = {line.split(None, 1)[0] for line in subprocess.check_output(['ps', '-axo', 'pid=,command='], text=True).splitlines()}
          if live & owned.keys():
              raise SystemExit('Original Bazel server/workers remain; no cache snapshot allowed')
          print('Bazel shutdown completed; recorded server/workers exited. No live-writer snapshot.')
          PY

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        timeout-minutes: 5
        if: ${{ false }} # Only the bounded action cache may write in this qualification.
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        id: clean_before_cache
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

      - name: Enforce action cache snapshot limit
        id: action_cache_limit
        if: always() && !cancelled() && steps.action_cache_gate.outcome == 'success' && steps.stop_bazel.outcome == 'success' && steps.clean_before_cache.outcome == 'success' && steps.restore_action_cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat
          from pathlib import Path
          root = Path.home() / '.cache/bazel-disk-cache'
          if not root.is_dir() or root.is_symlink():
              raise SystemExit('Missing or symlinked cache root: no snapshot')
          size = 0
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  entry = (Path(directory) / name).lstat()
                  if not (stat.S_ISREG(entry.st_mode) or stat.S_ISDIR(entry.st_mode)):
                      raise SystemExit('Non-regular cache entry: no snapshot')
                  if stat.S_ISREG(entry.st_mode):
                      size += entry.st_size
                  if size > 4 * 1024**3:
                      raise SystemExit('Cache exceeds 4GiB uncompressed: no snapshot')
          if size == 0:
              raise SystemExit('Empty cache: no snapshot')
          print(f'Bounded cache snapshot: {size} uncompressed bytes (limit 4294967296)')
          (Path(os.environ['RUNNER_TEMP']) / 'bazel-cache-size.txt').write_text(str(size))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'bytes={size}\n')
          PY
          df -h "$HOME/.cache/bazel-disk-cache"
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > "$RUNNER_TEMP/cache-usage-save.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/storage-limit" > "$RUNNER_TEMP/cache-limit-save.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          size = int((root / 'bazel-cache-size.txt').read_text())
          used = json.loads((root / 'cache-usage-save.json').read_text())['active_caches_size_in_bytes']
          configured = json.loads((root / 'cache-limit-save.json').read_text())['max_cache_size_gb']
          if type(configured) is not int or configured != 10 or type(used) is not int or used < 0:
              raise SystemExit('Quota envelope drift or invalid usage; no save allowed')
          limit = 10_000_000_000
          print(f'Pre-save quota={limit}, used={used}, snapshot={size}')
          if limit - used < size + 64 * 1024**2:
              raise SystemExit('Insufficient current cache headroom; no save/automatic eviction')
          PY

      - name: Save bounded exact native action cache
        id: save_action_cache
        if: always() && !cancelled() && steps.action_cache_limit.outcome == 'success'
        timeout-minutes: 5
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ steps.action_cache_identity.outputs.key }}

      - name: Verify actual saved cache service receipt
        if: always() && !cancelled() && steps.save_action_cache.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_KEY: ${{ steps.action_cache_identity.outputs.key }}
          CACHE_BYTES: ${{ steps.action_cache_limit.outputs.bytes }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$EXPECTED_KEY" -f ref="$GITHUB_REF" -f per_page=100 > "$RUNNER_TEMP/action-cache-receipt.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'action-cache-receipt.json').read_text())
          rows = [row for row in data['actions_caches'] if row['key'] == os.environ['EXPECTED_KEY'] and row['ref'] == os.environ['GITHUB_REF']]
          if (len(rows) != 1 or type(rows[0].get('id')) is not int or rows[0]['id'] <= 0
                  or type(rows[0].get('size_in_bytes')) is not int
                  or not 0 < rows[0]['size_in_bytes'] <= 4 * 1024**3):
              raise SystemExit('No unique bounded exact-key service receipt; do not admit continuation')
          print(json.dumps(dict(source=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'], uncompressed_bytes=int(os.environ['CACHE_BYTES']), cache=rows[0]), sort_keys=True))
          PY

      - name: Check final qualification source remains unchanged
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows-shard:
    if: ${{ false }} # Not selected for standard-Mac fit.
    # Split the Windows Bazel test leg across separate Windows hosts. Jobs with
    # BuildBuddy credentials use Linux RBE for build actions; test execution
    # remains on a Windows runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    runs-on: windows-2025
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm shard ${{ matrix.shard }}/4
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test BuildBuddy Bazel wrapper
        if: matrix.shard == 1
        shell: pwsh
        run: python .github/scripts/test_run_bazel_with_buildbuddy.py

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          # Reuse the former monolithic Windows test cache for restores. Do
          # not save it from every shard below; duplicate uploads would sit on
          # the PR-blocking critical path after the useful test work is done.
          cache-scope: bazel-test

      - name: bazel test shard
        env:
          BAZEL_TEST_SHARD: ${{ matrix.shard }}
          BAZEL_TEST_SHARD_COUNT: 4
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          bazel_test_query='tests(//...) except tests(//third_party/v8:all) except attr(tags, "manual", tests(//...))'
          mapfile -t bazel_targets < <(
            ./.github/scripts/run-bazel-query-ci.sh --output=label -- "${bazel_test_query}" \
              | LC_ALL=C sort
          )

          selected_targets=()
          for bazel_target in "${bazel_targets[@]}"; do
            target_bucket="$(
              printf '%s\n' "${bazel_target}" \
                | cksum \
                | awk -v shard_count="${BAZEL_TEST_SHARD_COUNT}" '{ print ($1 % shard_count) + 1 }'
            )"
            if [[ "${target_bucket}" == "${BAZEL_TEST_SHARD}" ]]; then
              selected_targets+=("${bazel_target}")
            fi
          done

          if [[ ${#selected_targets[@]} -eq 0 ]]; then
            echo "No Bazel test targets selected for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}." >&2
            exit 1
          fi

          echo "Selected ${#selected_targets[@]} of ${#bazel_targets[@]} Bazel test targets for Windows shard ${BAZEL_TEST_SHARD}/${BAZEL_TEST_SHARD_COUNT}."

          bazel_test_args=(
            test
            --skip_incompatible_explicit_targets
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_test_shard=${BAZEL_TEST_SHARD}
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-cross-compile \
            --remote-download-toplevel \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${selected_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-x86_64-pc-windows-gnullvm-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-windows:
    # Preserve the existing required-check surface while the real work happens
    # in the sharded Windows jobs above.
    if: ${{ false }} # No ordinary Windows aggregate award.
    needs: test-windows-shard
    runs-on: ubuntu-24.04
    name: Bazel test on windows-latest for x86_64-pc-windows-gnullvm

    steps:
      - name: Confirm Windows Bazel test shards passed
        shell: bash
        run: |
          if [[ "${{ needs.test-windows-shard.result }}" != "success" ]]; then
            echo "Windows Bazel test shards finished with result: ${{ needs.test-windows-shard.result }}" >&2
            exit 1
          fi

  test-windows-native-main:
    # Native Windows Bazel tests are slower and frequently approach the
    # 30-minute PR budget. Run this only for post-merge commits to main and give
    # it a larger timeout.
    if: ${{ false }} # Not selected for standard-Mac fit.
    timeout-minutes: 40
    runs-on: windows-2025
    name: Bazel test on windows-latest for x86_64-pc-windows-msvc (native main)
    environment:
      name: bazel
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: bazel-${{ github.job }}

      - name: bazel test //...
        env:
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets=(
            //...
            # Keep standalone V8 library targets out of the ordinary Bazel CI
            # path. V8 consumers under `//codex-rs/...` still participate
            # transitively through `//...`.
            -//third_party/v8:all
            -//codex-rs/v8-poc:v8-poc-unit-tests
          )

          bazel_test_args=(
            test
            --platforms=//:windows_x86_64_msvc
            --test_tag_filters=-argument-comment-lint
            --test_verbose_timeout_warnings
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_windows_native_main=true
          )

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --windows-msvc-host-platform \
            -- \
            "${bazel_test_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-windows-native-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  clippy:
    if: ${{ false }} # Not selected for the one-job cache operation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Linux lint coverage on x64 and add the arm64 macOS path that
          # the Bazel test job already exercises. Add Windows gnullvm as well
          # so PRs get Bazel-native lint signal on the same Windows toolchain
          # that the Bazel test job uses.
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Bazel clippy on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - name: Record standard Mac fit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test -z "${BUILDBUDDY_API_KEY:-}"
          printf 'source=%s job=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          sw_vers
          sysctl hw.ncpu hw.memsize
          df -h
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          printf 'Cross-target x86_64 on ARM is not native Intel coverage.\n'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build --config=clippy lint targets
        env:
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_clippy_args=(
            --config=clippy
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=clippy
          )
          bazel_wrapper_args=()
          bazel_target_list_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # Keep this aligned with the fast Windows Bazel test job: use
            # Linux RBE for clippy build actions while targeting Windows
            # gnullvm. Fork/community PRs without the BuildBuddy secret fall
            # back inside `run-bazel-ci.sh` to the previous local Windows MSVC
            # host-platform shape.
            bazel_wrapper_args+=(--windows-cross-compile)
            bazel_target_list_args+=(--windows-cross-compile)
            if [[ -z "${BUILDBUDDY_API_KEY:-}" ]]; then
              # The fork fallback can see incompatible explicit Windows-cross
              # internal test binaries in the generated target list. Preserve
              # the old local-fallback behavior there.
              bazel_clippy_args+=(--skip_incompatible_explicit_targets)
            fi
          fi

          bazel_target_lines="$(./scripts/list-bazel-clippy-targets.sh "${bazel_target_list_args[@]}")"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_clippy_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-clippy-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify-release-build:
    if: ${{ false }} # Not selected for the one-job cache operation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs_on || matrix.os }}
    name: Verify release build on ${{ matrix.os }} for ${{ matrix.target }}
    environment:
      name: bazel
      deployment: false

    steps:
      - name: Record standard Mac fit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test -z "${BUILDBUDDY_API_KEY:-}"
          printf 'source=%s job=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          sw_vers
          sysctl hw.ncpu hw.memsize
          df -h
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          printf 'Cross-target x86_64 on ARM is not native Intel coverage.\n'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-${{ github.job }}

      - name: bazel build verify-release-build targets
        env:
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          # This job exists to compile Rust code behind
          # `cfg(not(debug_assertions))` so PR CI catches failures that would
          # otherwise show up only in a release build. We do not need the full
          # optimizer and debug-info work that normally comes with a release
          # build to get that signal, so keep Bazel in `fastbuild` and disable
          # Rust debug assertions explicitly.
          bazel_wrapper_args=()
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # This is build-only signal, so use the same Linux-RBE
            # cross-compile path as the fast Windows test and clippy jobs.
            # Fork/community PRs without the BuildBuddy secret fall back
            # inside `run-bazel-ci.sh` to the previous local Windows MSVC
            # host-platform shape.
            bazel_wrapper_args+=(--windows-cross-compile)
          fi

          bazel_build_args=(
            --compilation_mode=fastbuild
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no
            --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}
            --build_metadata=TAG_job=verify-release-build
            --build_metadata=TAG_rust_debug_assertions=off
          )

          bazel_target_lines="$(bash ./scripts/list-bazel-release-targets.sh)"
          bazel_targets=()
          while IFS= read -r target; do
            bazel_targets+=("${target}")
          done <<< "${bazel_target_lines}"

          ./.github/scripts/run-bazel-ci.sh \
            "${bazel_wrapper_args[@]}" \
            -- \
            build \
            "${bazel_build_args[@]}" \
            -- \
            "${bazel_targets[@]}"

      - name: Verify Bazel builds bwrap
        if: runner.os == 'Linux'
        env:
          BUILDBUDDY_API_KEY: ${{ env.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            --print-failed-action-summary \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=verify-bwrap \
            -- \
            //codex-rs/bwrap:bwrap

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-verify-release-build-${{ matrix.target }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Save the job-scoped Bazel repository cache after cache misses. Keep the
      # upload non-fatal so cache service issues never fail the job itself.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
